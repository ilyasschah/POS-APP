name: Deploy Backend to OVH Test

# Runs on the self-hosted runner installed directly on the OVH test box.
# Publishes Web-POS.Api and replaces the files under C:\inetpub\wwwroot\pos-api,
# then re-injects the Test-environment secrets (DB connection strings, JWT
# secret, admin portal seed password) into the freshly-generated web.config, since
# those secrets are never committed to the repo and dotnet publish regenerates
# web.config from the checked-in template on every run.

on:
  push:
    branches: [test]
    paths:
      - "Back-End/**"
      - ".github/workflows/deploy-backend-test.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, ovh-test]
    steps:
      - uses: actions/checkout@v4

      - name: Publish Web-POS.Api (Release)
        shell: powershell
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "pos-api-publish"
          if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }
          dotnet publish "Back-End/Web-POS.Api/Web-POS.Api.csproj" -c Release -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          echo "PUBLISH_DIR=$publishDir" >> $env:GITHUB_ENV

      - name: Take app offline
        shell: powershell
        # ANCM (both hosting models) watches for app_offline.htm in the site root and
        # gracefully unloads the app, releasing the lock on Web-POS.Api.dll. This needs
        # only filesystem write access to the site folder - no IIS management API
        # rights, so it works from a low-privilege runner service account.
        run: |
          Set-Content -Path "C:\inetpub\wwwroot\pos-api\app_offline.htm" -Value "Deploying..." -Encoding utf8
          Start-Sleep -Seconds 5

      - name: Replace site files
        shell: powershell
        run: |
          # lease_signing_key.pem is a server-only secret (gitignored, never in the
          # publish output) - excluded here so /MIR doesn't delete it. app_offline.htm
          # is excluded so it survives until the "bring back online" step removes it.
          robocopy "$env:PUBLISH_DIR" "C:\inetpub\wwwroot\pos-api" /MIR /XD logs /XF app_offline.htm lease_signing_key.pem /NFL /NDL /NJH /NJS
          $rc = $LASTEXITCODE
          if ($rc -ge 8) { throw "robocopy failed with exit code $rc" }
          # Robocopy's own "success" codes (0-7) are non-zero (e.g. 1 = files copied),
          # and the runner auto-propagates $LASTEXITCODE as the step's exit code - so
          # without this, a successful copy still fails the step.
          exit 0

      - name: Ensure Data Protection key ring survives the deploy
        shell: powershell
        # The portal's session cookie and every antiforgery token are encrypted with
        # Data Protection keys. This folder is deliberately OUTSIDE the site root:
        # the "Replace site files" step above runs robocopy /MIR, which deletes
        # anything under the site that it did not just copy. Keys kept inside would
        # be wiped on every deploy, signing out every operator and turning an already
        # open login form into a 400.
        run: |
          $keyPath = "C:\inetpub\pos-api-keys"
          if (-not (Test-Path $keyPath)) { New-Item -ItemType Directory -Path $keyPath -Force | Out-Null }

          # The app pool identity must be able to write here. Best-effort on purpose:
          # the app probes writability at startup and falls back to the framework
          # default rather than failing, so a permissions problem degrades to "signed
          # out on deploy" instead of taking the whole API down.
          #
          # $(...) around the variable is required - PowerShell would otherwise read
          # "$env:POS_API_APP_POOL:" as a provider path and swallow the colon that
          # separates the principal from the rights.
          $principal = "IIS AppPool\$($env:POS_API_APP_POOL)"
          icacls $keyPath /grant "$($principal):(OI)(CI)M" | Out-Null
          # icacls is a native exe: a failure sets $LASTEXITCODE, it does not throw,
          # so try/catch would never see it and the runner would propagate the code
          # and fail the whole deploy over a permissions grant.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Could not grant '$principal' write access to $keyPath. Admin portal sessions will not survive deploys. Check the API startup log line 'DataProtection keys'."
          }
          exit 0
        env:
          POS_API_APP_POOL: ${{ vars.TEST_APP_POOL_NAME || 'pos-api' }}

      - name: Inject Test environment secrets into web.config
        shell: powershell
        env:
          TEST_DB_CONN: ${{ secrets.TEST_DB_CONNECTION_STRING }}
          TEST_MASTER_DB_CONN: ${{ secrets.TEST_MASTER_DB_CONNECTION_STRING }}
          TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          # The admin portal's first account is seeded on startup. Without this the
          # seed uses the password published in the source, on a PUBLIC hostname.
          TEST_ADMIN_SEED_PASSWORD: ${{ secrets.TEST_ADMIN_PORTAL_SEED_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TEST_ADMIN_SEED_PASSWORD)) {
            Write-Host "::warning::TEST_ADMIN_PORTAL_SEED_PASSWORD is not set. If the Master DB has no admin account yet, /admin will be seeded with the default password from the source - on a public URL. Set the secret and redeploy, or change the password immediately at /admin/account/password."
          }
          $path = "C:\inetpub\wwwroot\pos-api\web.config"
          [xml]$xml = Get-Content $path -Raw
          $aspNetCore = $xml.SelectSingleNode("//aspNetCore")

          $envVarsNode = $xml.CreateElement("environmentVariables")

          function Add-EnvVar([string]$name, [string]$value) {
            $node = $xml.CreateElement("environmentVariable")
            $node.SetAttribute("name", $name)
            $node.SetAttribute("value", $value)
            $envVarsNode.AppendChild($node) | Out-Null
          }

          Add-EnvVar "ASPNETCORE_ENVIRONMENT" "Test"
          Add-EnvVar "ConnectionStrings__DefaultConnection" $env:TEST_DB_CONN
          Add-EnvVar "ConnectionStrings__MasterConnection" $env:TEST_MASTER_DB_CONN
          Add-EnvVar "Jwt__Secret" $env:TEST_JWT_SECRET
          Add-EnvVar "DataProtection__KeyPath" "C:\inetpub\pos-api-keys"

          # AdminPortal__AccessKey is GONE. The portal used to be gated by that one
          # shared secret; it now has real per-user accounts in the Master DB, and
          # nothing reads the key any more. Only seeded on a first-ever deploy, and
          # only when the Master DB has no admin account yet.
          if (-not [string]::IsNullOrWhiteSpace($env:TEST_ADMIN_SEED_PASSWORD)) {
            Add-EnvVar "AdminPortal__SeedPassword" $env:TEST_ADMIN_SEED_PASSWORD
          }

          $aspNetCore.AppendChild($envVarsNode) | Out-Null
          $xml.Save($path)

      - name: Bring app back online
        # Runs even if an earlier step failed - app_offline.htm must never be left
        # behind, or the site stays down until someone notices and fixes it by hand.
        if: always()
        shell: powershell
        run: |
          Remove-Item "C:\inetpub\wwwroot\pos-api\app_offline.htm" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

      - name: Health check
        if: always()
        shell: powershell
        run: |
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "https://51-91-6-6.sslip.io/swagger/v1/swagger.json" -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { throw "Health check failed: site did not return 200 after deploy" }
          Write-Host "Deploy healthy: https://51-91-6-6.sslip.io"

      - name: Admin portal health check
        if: always()
        shell: powershell
        # Swagger answering proves the app started; it does NOT prove the portal is
        # usable. The two ways this deploy can leave /admin broken while the API looks
        # perfectly healthy are (a) the login page ending up behind its own login and
        # (b) the AdminUser table failing to create in the Master DB. Both surface here.
        run: |
          # Windows PowerShell 5.1 is inconsistent about -MaximumRedirection 0: a 3xx
          # sometimes returns the response and sometimes throws a WebException. Read
          # the status from whichever way it comes back.
          function Get-Status([string]$url) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15 `
                     -MaximumRedirection 0 -ErrorAction Stop
              return [int]$r.StatusCode
            } catch [System.Net.WebException] {
              if ($_.Exception.Response) { return [int]$_.Exception.Response.StatusCode }
              throw
            }
          }

          $loginStatus = Get-Status "https://51-91-6-6.sslip.io/admin/login"
          if ($loginStatus -ne 200) {
            throw "Admin login page returned $loginStatus, expected 200. If it is 302 the login page ended up behind its own login and nobody can sign in; if 500, check the startup log for 'ADMIN PORTAL UNUSABLE'."
          }

          # A signed-out request for a real portal page must be redirected, never served.
          $guardedStatus = Get-Status "https://51-91-6-6.sslip.io/admin/companies"
          if ($guardedStatus -ne 302) {
            throw "SECURITY: /admin/companies returned $guardedStatus while signed out, expected a 302 to the login page."
          }

          Write-Host "Admin portal healthy: login page reachable, guarded pages redirect."
