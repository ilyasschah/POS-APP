name: Deploy Dashboard to Production

# Builds octopus_dashboard_web for the web and publishes it to
# C:\inetpub\wwwroot\dashboard on the OVH production box, where it is served as a
# sub-application of the API site at https://api.octopus-pos.com/dashboard/.
#
# Serving it from the SAME origin as the API is deliberate: the dashboard then
# calls https://api.octopus-pos.com/api same-origin and never touches CORS, and
# there is only one certificate to keep alive.
#
# 🚨 Deploys from `prod`, NOT `main` - same rule as the backend workflow.

on:
  push:
    branches: [prod]
    paths:
      # Must match the folder's real casing. GitHub evaluates path filters
      # against the git tree, which is case-SENSITIVE, so the old
      # "OCTOPUS_DASHBOARD_WEB/**" never matched octopus_dashboard_web/ and
      # that workflow only ever ran when someone triggered it by hand.
      - "octopus_dashboard_web/**"
      - ".github/workflows/deploy-dashboard-prod.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dashboard-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, octopus-prod]
    steps:
      - uses: actions/checkout@v4

      - name: Build Flutter Web (Release)
        working-directory: ./octopus_dashboard_web
        shell: powershell
        env:
          CI: true
        run: |
          # 1. Force delete the stuck lock file
          Remove-Item -Path "C:\flutter\bin\cache\lock_file" -Force -ErrorAction SilentlyContinue

          # 2. Tell Git the Flutter directory is safe for the background runner
          git config --global --add safe.directory C:/flutter

          # 3. Disable analytics
          & "C:\flutter\bin\flutter.bat" config --no-analytics

          # 4. Run Flutter commands
          & "C:\flutter\bin\flutter.bat" pub get -v
          & "C:\flutter\bin\flutter.bat" build web --release --base-href /dashboard/ -v

          if ($LASTEXITCODE -ne 0) { throw "flutter build web failed" }

          $publishDir = Join-Path $env:GITHUB_WORKSPACE "octopus_dashboard_web\build\web"
          echo "PUBLISH_DIR=$publishDir" >> $env:GITHUB_ENV

      - name: Replace site files
        shell: powershell
        run: |
          $targetDir = "C:\inetpub\wwwroot\dashboard"
          if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }

          robocopy "$env:PUBLISH_DIR" "$targetDir" /MIR /NFL /NDL /NJH /NJS
          $rc = $LASTEXITCODE
          if ($rc -ge 8) { throw "robocopy failed with exit code $rc" }

          exit 0

      - name: Health check
        if: always()
        shell: powershell
        # Fetching the folder is not enough on its own: IIS happily returns a
        # directory listing or a stale index.html. Assert that what came back is
        # actually a built Flutter app by looking for its bootstrap script.
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "https://api.octopus-pos.com/dashboard/" -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200 -and $r.Content -match "flutter_bootstrap.js|main.dart.js") {
                $ok = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 3
          }
          if (-not $ok) {
            throw "Dashboard health check failed: https://api.octopus-pos.com/dashboard/ did not return a built Flutter app. If it 404s, check that the 'dashboard' folder is configured as an IIS application under the API site."
          }
          Write-Host "Dashboard healthy: https://api.octopus-pos.com/dashboard/"
