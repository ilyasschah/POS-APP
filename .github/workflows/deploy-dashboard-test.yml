name: Deploy Dashboard to OVH Test

on:
  push:
    branches: [test]
    paths:
      - "OCTOPUS_DASHBOARD_WEB/**"
      - ".github/workflows/deploy-dashboard-test.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dashboard-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, ovh-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Flutter Web (Release)
        working-directory: ./OCTOPUS_DASHBOARD_WEB
        shell: powershell
        env:
          CI: true
        run: |
          # 1. Force delete the stuck lock file
          Remove-Item -Path "C:\flutter\bin\cache\lock_file" -Force -ErrorAction SilentlyContinue
          
          # 2. Tell Git the Flutter directory is safe for the background runner
          git config --global --add safe.directory C:/flutter
          
          # 3. Disable analytics
          & "C:\flutter\bin\flutter.bat" config --no-analytics
          
          # 4. Run Flutter commands
          & "C:\flutter\bin\flutter.bat" pub get -v
          & "C:\flutter\bin\flutter.bat" build web --release --base-href /dashboard/ -v
          
          if ($LASTEXITCODE -ne 0) { throw "flutter build web failed" }
          
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "OCTOPUS_DASHBOARD_WEB\build\web"
          echo "PUBLISH_DIR=$publishDir" >> $env:GITHUB_ENV

      - name: Replace site files
        shell: powershell
        run: |
          $targetDir = "C:\inetpub\wwwroot\dashboard"
          if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }
          
          robocopy "$env:PUBLISH_DIR" "$targetDir" /MIR /NFL /NDL /NJH /NJS
          $rc = $LASTEXITCODE
          if ($rc -ge 8) { throw "robocopy failed with exit code $rc" }
          
          exit 0

      - name: Health check
        if: always()
        shell: powershell
        run: |
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "https://51-91-6-6.sslip.io/dashboard/" -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { throw "Health check failed: Dashboard did not return 200 after deploy" }
          Write-Host "Dashboard deploy healthy!"