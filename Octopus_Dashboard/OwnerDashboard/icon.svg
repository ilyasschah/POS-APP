<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Space Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E" />
      <stop offset="100%" stop-color="#16213E" />
    </linearGradient>
    
    <!-- Blood Node Gradient.
         LIGHTER than the UI accent (#A4161A) on purpose: the mark sits on the
         navy plate, where #A4161A measures 2.20:1 and all but disappears. These
         two clear 4.29:1 and 3.41:1 on that ground while staying the same blood
         red the interface uses on white. Same hue family, different ground,
         different lightness — the rule the whole palette runs on. -->
    <linearGradient id="octoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0353B" />
      <stop offset="100%" stop-color="#D62828" />
    </linearGradient>
  </defs>

  <!-- App Icon Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g fill="url(#octoGrad)">
    <!-- Central Hub / Head -->
    <circle cx="256" cy="210" r="70" />

    <!-- Nodes / Tentacles representing POS terminals -->
    <!-- Left side -->
    <path d="M 190 230 Q 120 280 130 360" fill="none" stroke="url(#octoGrad)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="130" cy="360" r="28" />

    <path d="M 210 260 Q 160 350 190 420" fill="none" stroke="url(#octoGrad)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="190" cy="420" r="28" />

    <!-- Center downward -->
    <path d="M 256 280 Q 256 380 256 440" fill="none" stroke="url(#octoGrad)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="256" cy="440" r="28" />

    <!-- Right side -->
    <path d="M 322 230 Q 392 280 382 360" fill="none" stroke="url(#octoGrad)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="382" cy="360" r="28" />

    <path d="M 302 260 Q 352 350 322 420" fill="none" stroke="url(#octoGrad)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="322" cy="420" r="28" />

    <!-- Upper network nodes for balance -->
    <path d="M 195 175 Q 120 150 140 100" fill="none" stroke="url(#octoGrad)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="140" cy="100" r="28" />

    <path d="M 317 175 Q 392 150 372 100" fill="none" stroke="url(#octoGrad)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="372" cy="100" r="28" />
  </g>

  <!-- Abstract connections inside the hub -->
  <circle cx="226" cy="200" r="14" fill="#1A1A2E" />
  <circle cx="286" cy="200" r="14" fill="#1A1A2E" />
  <path d="M 236 235 H 276" fill="none" stroke="#1A1A2E" stroke-width="10" stroke-linecap="round"/>
</svg>
