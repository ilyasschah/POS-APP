name: pos_app
description: "A new Flutter project."
publish_to: 'none'
# 1.0.1 is the release being cut (matches tag v1.0.1); +3 keeps the build number
# moving forward from 1.0.0+2 Ã¢â‚¬â€ Android's versionCode is derived from it and must
# never decrease, and `1.0.1` with no build number would silently reset it to 1.
version: 1.0.11+14

environment:
  sdk: '>=3.0.0 >3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Localization Ã¢â‚¬â€ supplies GlobalMaterialLocalizations/WidgetsLocalizations
  # (Material widgets + the shared date picker render non-English through these)
  # and the Directionality defaults the RTL layout relies on.
  flutter_localizations:
    sdk: flutter
  pdf: ^3.11.0
  printing: ^5.12.0
  # State Management & Network
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  dio: ^5.7.0
  
  # Data Models & JSON
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0
  
  # Utilities
  google_fonts: ^8.0.2
  intl: ^0.20.2
  fl_chart: ^1.2.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  image_picker: ^1.2.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0
  window_manager: ^0.5.1
  flutter_secure_storage: ^10.1.0
  uuid: ^4.5.3
  file_picker: ^8.1.7
  xml: ^6.5.0

  # UI & Design
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  skeletonizer: ^2.1.3
  phosphor_flutter: ^2.1.0

  # Offline-first / Drift
  drift: ^2.22.0
  # Pillar 3 Ã¢â‚¬â€ sqlite3 3.3.3+ ships SQLCipher as a native-assets build hook.
  # The `hooks.user_defines.sqlite3.source: sqlcipher` block below makes the
  # hook download a prebuilt SQLCipher library (encryption-at-rest), so NO
  # `sqlcipher_flutter_libs` / OpenSSL build is needed.
  sqlite3: ^3.3.3
  # Pillar 3 Ã¢â‚¬â€ stable per-device fingerprint used as HKDF salt for the DB key.
  device_info_plus: ^11.1.0
  # Reads the version the app was BUILT with, so `version:` above is the single
  # source of truth. It was previously a string literal in the About tab, which
  # meant the number on screen could not disagree with the shipped build Ã¢â‚¬â€ it
  # simply never changed. An updater that compares versions needs this to be real.
  package_info_plus: ^8.1.2
  # Pillar 3 Ã¢â‚¬â€ HMAC/SHA-256 for HKDF key derivation (never a hardcoded key).
  crypto: ^3.0.6
  path_provider: ^2.1.5
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  qr_flutter: ^4.1.0
  lottie: ^3.1.2
  # Pillar 2 Ã¢â‚¬â€ verify the RS256 offline subscription lease signature on-device.
  dart_jsonwebtoken: ^2.14.0
  # Serial weighing scale. The plugin declares an Android class so the APK still
  # builds, but a COM/tty scale is only reachable on Windows in practice Ã¢â‚¬â€ the
  # scale UI and ScaleService are capability-gated to Windows (see lib/scale/).
  flutter_libserialport: ^0.6.0
  # Cash-drawer kick through a Windows print queue. `printing` is a PDF pipeline
  # and cannot send raw ESC/POS bytes, so `printer/raw_printer_windows.dart`
  # calls the spooler's RAW path (OpenPrinter/StartDocPrinter/WritePrinter)
  # directly. Both arrived transitively already; declared because that file
  # imports them, and a transitive path is not a promise.
  ffi: ^2.1.0
  win32: ^5.5.0
  # Reads HKLM\HARDWARE\DEVICEMAP, which is where Windows itself records the
  # COM and LPT ports a machine actually has — the same key .NET's
  # SerialPort.GetPortNames() reads, so `utils/windows_ports.dart` offers the
  # operator the same list every other POS on the till does. Transitive via
  # path_provider_windows; declared for the same reason as ffi/win32 above.
  win32_registry: ^2.1.0
  audioplayers: ^6.8.1

dependency_overrides:
  phosphor_flutter:
    path: patches/phosphor_flutter
  # Force latest patch versions of Android sub-packages to eliminate KGP warnings.
  image_picker_android: ^0.8.13+19
  shared_preferences_android: ^2.4.25
  url_launcher_android: ^6.3.32

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Drives the update watcher's timers in tests without waiting 6 real hours.
  # It arrives transitively via flutter_test, but importing a package you have
  # not declared breaks the day that transitive path changes.
  fake_async: ^1.3.1
  # App-icon generator. Config lives in the top-level `flutter_icons:` block
  # below Ã¢â‚¬â€ both must be OUTSIDE `dependencies:`, or pub rejects the file with
  # "A dependency may only have one source".
  flutter_launcher_icons: ^0.13.1

  # Code Generators (The "Build" tools)
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.9.0
  
  # Web Support
  build_web_compilers: ^4.0.12

  # Offline-first / Drift
  drift_dev: ^2.22.0

  # Lints (OPT-4: re-enable the recommended Flutter lint set)
  flutter_lints: ^4.0.0

# App-icon generation (flutter_launcher_icons). Top-level on purpose.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
  # macOS was missing here, which is why the .app shipped Flutter's default blue
  # logo while every other platform had the octopus. The generated PNGs live in
  # macos/Runner/Assets.xcassets/AppIcon.appiconset and ARE committed â€” Xcode
  # reads them from the asset catalog at build time, so CI must not have to run
  # this tool first.
  macos:
    generate: true
    image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  # Runs gen-l10n on build: lib/l10n/*.arb -> AppLocalizations (see l10n.yaml).
  generate: true
  assets:
    - assets/animations/success_animation.json
    # Bundled (NOT fetched at runtime) so Arabic receipts still print on an
    # offline terminal. The PDF standard-14 faces and PdfGoogleFonts.notoSans*
    # carry no Arabic glyphs at all Ã¢â‚¬â€ without this, Arabic text lays out
    # correctly and renders as empty boxes.
    - assets/fonts/
    # POS feedback sounds (see lib/core/sound_service.dart). Short 16-bit mono
    # WAVs, generated rather than sampled so they ship with no licence attached
    # â€” replace any file with your own of the same name and it is picked up on
    # the next build.
    - assets/sounds/

# Pillar 3 Ã¢â‚¬â€ tell the sqlite3 native-assets build hook to provide SQLCipher
# (encryption-at-rest) instead of the default plaintext SQLite. The hook
# downloads a prebuilt, ABI-compatible SQLCipher library for each target.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
