# The KDS is its own Flutter app with its own strings — it shares nothing with
# /Front-End, so the generated class is named differently to make an accidental
# cross-import obvious at the call site.
arb-dir: lib/l10n
template-arb-file: kds_en.arb
output-localization-file: kds_localizations.dart
output-class: KdsLocalizations
nullable-getter: false
