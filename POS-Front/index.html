<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cashier POS</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="pos-container">
        <header class="pos-header">
            <div class="brand">
                <h1>Cashier POS</h1>
                <p id="posStatus">Ready</p>
            </div>
            <div class="header-actions">
                <input id="barcodeInput" class="barcode-input" placeholder="Scan barcode or type and hit Enter…" autofocus />
                <button id="reloadBtn" class="btn btn-primary" type="button">Reload Catalog</button>
                <a href="orders.html" class="btn btn-secondary">View Orders</a>
            </div>
        </header>

        <main class="pos-main">
            <!-- LEFT: Catalog -->
            <section class="catalog">
                <div class="catalog-controls">
                    <div class="groups-scroll" id="groupPills"></div>
                    <div class="search-wrap">
                        <input id="productSearch" class="search-input" placeholder="Search products by name, code, PLU…" />
                    </div>
                </div>

                <div id="catalogStats" class="stats slim hidden">
                    <div class="stat-item">
                        <h3 id="statProducts">0</h3>
                        <p>Products</p>
                    </div>
                    <div class="stat-item">
                        <h3 id="statGroups">0</h3>
                        <p>Groups</p>
                    </div>
                    <div class="stat-item">
                        <h3 id="statAvgPrice">$0.00</h3>
                        <p>Avg Price</p>
                    </div>
                </div>

                <div id="catalogLoading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Loading catalog…</p>
                </div>

                <div id="catalogError" class="error hidden">
                    <p id="catalogErrorMessage"></p>
                    <button class="close-btn" id="catalogErrorClose" type="button">×</button>
                </div>

                <div id="productGrid" class="product-grid"></div>

                <div id="noCatalogResults" class="no-results hidden">
                    <h3>No products match your filters</h3>
                    <p>Try clearing the search or choose another group</p>
                </div>
            </section>

            <!-- RIGHT: Cart -->
            <aside class="cart">
                <div class="cart-header">
                    <h2>Current Order</h2>
                    <div class="cart-actions">
                        <button id="clearCartBtn" class="btn btn-secondary" type="button">Clear</button>
                    </div>
                </div>

                <div id="cartList" class="cart-list"></div>

                <div class="cart-summary">
                    <div class="row">
                        <span>Subtotal</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="row">
                        <span>Tax</span>
                        <span id="taxTotal">$0.00</span>
                    </div>
                    <div class="row grand">
                        <span>Total</span>
                        <span id="grandTotal">$0.00</span>
                    </div>
                </div>

                <div class="payment">
                    <div class="pay-methods">
                        <button class="btn btn-light" data-pay="cash" type="button">Cash</button>
                        <button class="btn btn-light" data-pay="card" type="button">Card</button>
                        <button class="btn btn-light" data-pay="mixed" type="button">Mixed</button>
                    </div>
                    <div class="pay-entry">
                        <input id="amountTendered" type="number" step="0.01" placeholder="Amount tendered" />
                        <div class="change-line">
                            <span>Change</span>
                            <span id="changeDue">$0.00</span>
                        </div>
                    </div>

                    <div class="pay-actions">
                        <button id="saveOrderBtn" class="btn btn-warning full" type="button">Save Order</button>
                        <button id="completeSaleBtn" class="btn btn-success full" type="button">Complete Sale</button>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Confirm Sale</h3>
                <button class="close-btn" id="confirmClose" type="button">×</button>
            </div>
            <div class="modal-body">
                <div class="confirm-line"><span>Items</span><span id="confirmItems">0</span></div>
                <div class="confirm-line"><span>Total</span><span id="confirmTotal">$0.00</span></div>
                <div class="confirm-line"><span>Payment</span><span id="confirmMethod">Cash</span></div>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" id="cancelConfirm" type="button">Cancel</button>
                <button class="submit-btn" id="confirmSubmit" type="button">Yes, process</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
